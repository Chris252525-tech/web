<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solicitud de Mantenimiento - UTSOE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #6188a1;
      padding: 15px 30px;
      color: white;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 50px;
    }

    nav ul li {
      display: inline;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 10px 15px;
      display: inline-block;
      transition: color 0.3s ease-in-out, text-decoration 0.3s ease-in-out;
    }

    nav ul li a:hover {
      color: darkgray;
    }

    .hero {
      text-align: center;
      background: #ddd;
      padding: 20px;
    }

    .hero img {
      width: 100%;
      max-width: 500px;
      border-radius: 100px;
    }

    .form-container {
      max-width: 600px;
      background: white;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    form input,
    form textarea,
    form select {
      display: block;
      width: 100%;
      max-width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .submit {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s;
    }

    .submit:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }

    footer {
      background: #6188a1;
      color: white;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      max-width: 100%;
    }

    .footer-section {
      width: 100%;
      max-width: 400px;
      margin: auto;
      text-align: center;
    }

    @media (max-width: 600px) {
      footer {
        flex-direction: column;
        text-align: center;
      }

      .footer-section {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">UTSOE - Mantenimiento</div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="seguimiento.html">Seguimiento</a></li>
      </ul>
    </nav>
  </header>

  <div class="hero">
    <h1>Solicitud de Mantenimiento</h1>
    <p>Universidad Tecnológica del Suroeste de Guanajuato</p>
  </div>

  <div class="form-container">
    <h2>Formulario de Solicitud</h2>
    <form action="procesar_solicitud.php" method="post">

      <label for="nombre">Nombre del solicitante</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo institucional</label>
      <input type="email" id="correo" name="correo" required>

      <label for="edificio">Edificio</label>
      <select id="edificio" name="edificio" required>
        <option value="">Seleccione un edificio</option>
        <option value="A">Edificio A</option>
        <option value="B">Edificio B</option>
        <option value="C">Edificio C</option>
        <option value="Laboratorios">Laboratorios</option>
        <option value="Talleres">Talleres</option>
      </select>

      <label for="aula">Aula o ubicación específica</label>
      <input type="text" id="aula" name="aula" required>

      <label for="descripcion">Descripción del problema</label>
      <textarea id="descripcion" name="descripcion" rows="5" required></textarea>

      <button type="submit" class="submit">Enviar Solicitud</button>
    </form>
  </div>

  <footer>
    <div class="footer-section">
      <p>&copy; 2025 UTSOE - Departamento de Mantenimiento</p>
    </div>
  </footer>

</body>
</html>
